<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Control+</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="control-plus-bars-icon.svg">
  <script>
    // Roda antes da primeira pintura: sem isto a página aparece no tema errado
    // por um instante até o Angular subir. Mesma lógica do ThemeService.
    (function () {
      try {
        var saved = localStorage.getItem('controlplus:theme');
        if (saved !== 'light' && saved !== 'dark') {
          saved = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = saved;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
