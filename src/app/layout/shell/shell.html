<div class="shell" [class.menu-open]="menuOpen()">

  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3.4"
                stroke-linecap="square" />
        </svg>
      </span>
      Control+
    </a>

    <nav class="nav">
      <p class="nav-label">Menu</p>
      <ul>
        @for (item of nav; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active"
               [title]="item.source" (click)="closeMenu()">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="side-foot">
      <span class="avatar" aria-hidden="true">{{ initial() }}</span>
      <div class="who">
        <p class="who-name" [title]="user() ?? ''">{{ user() ?? 'Minha conta' }}</p>
        <button type="button" class="who-out" (click)="logout()">Sair</button>
      </div>
      <app-theme-toggle />
    </div>
  </aside>

  <div class="content">
    <button type="button" class="menu-toggle btn btn-ghost" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-controls="conteudo">
      {{ menuOpen() ? 'Fechar' : 'Menu' }}
    </button>

    <main id="conteudo">
      <router-outlet />
    </main>
  </div>

  <button type="button" class="scrim" (click)="closeMenu()" tabindex="-1"
          aria-hidden="true"></button>
</div>
