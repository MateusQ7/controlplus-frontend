<div class="shell" [class.menu-open]="menuOpen()">

  <aside class="sidebar" aria-label="Navegação principal">
    <a class="brand" routerLink="/dashboard" (click)="closeMenu()">
      <!--
        Mesma arte de public/control-plus-icone-verde.svg, inline para o miolo
        acompanhar o tema pelos mesmos tokens do lockup do login.
      -->
      <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
        <rect x="0" y="0" width="512" height="512" rx="128" class="sq" />
        <rect x="61.44" y="296.96" width="71.68" height="122.88" rx="25.6" class="br" />
        <rect x="163.84" y="225.28" width="71.68" height="194.56" rx="25.6" class="br" />
        <rect x="266.24" y="153.6" width="71.68" height="266.24" rx="25.6" class="br" />
        <rect x="348.16" y="79.36" width="122.88" height="46.08" rx="23.04" class="br" />
        <rect x="386.56" y="40.96" width="46.08" height="122.88" rx="23.04" class="br" />
      </svg>
      Control+
    </a>

    <nav class="nav">
      <p class="nav-label">Menu</p>
      <ul>
        @for (item of nav; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active"
               [title]="item.source" (click)="closeMenu()">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="side-foot">
      <span class="avatar" aria-hidden="true">{{ initial() }}</span>
      <div class="who">
        <p class="who-name" [title]="user()?.email ?? ''">
          {{ user()?.name ?? 'Minha conta' }}
        </p>
        <button type="button" class="who-out" (click)="logout()">Sair</button>
      </div>
      <app-theme-toggle />
    </div>
  </aside>

  <div class="content">
    <button type="button" class="menu-toggle btn btn-ghost" (click)="toggleMenu()"
            [attr.aria-expanded]="menuOpen()" aria-controls="conteudo">
      {{ menuOpen() ? 'Fechar' : 'Menu' }}
    </button>

    <main id="conteudo">
      <router-outlet />
    </main>
  </div>

  <button type="button" class="scrim" (click)="closeMenu()" tabindex="-1"
          aria-hidden="true"></button>
</div>
